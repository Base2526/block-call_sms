# version: '3.8'
services:
  backend:
    build:
      context: ./backend_ts
      dockerfile: Dockerfile.dev   
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # set can run docker inside ex. run docker backup db(a4_mongo)
      - ./backend_ts/src:/app/src      
      - ./uploads:/app/uploads  
    depends_on:
      - postgres
    networks:
      - blockcall-network

  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exampledb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - blockcall-network

networks:
  blockcall-network:
    external: true
    driver: bridge