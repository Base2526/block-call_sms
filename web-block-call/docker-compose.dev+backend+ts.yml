version: "3"
services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: blockcall_frontend
    env_file:
      - ./env/.env.ui.ts
    environment:
      - NODE_ENV=development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./uploads:/var/storage
    networks:
      - blockcall-network

  backend:
    build:
      context: ./backend_ts
      dockerfile: Dockerfile.dev   
    container_name: blockcall_backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # set can run docker inside ex. run docker backup db(a4_mongo)
      - ./backend_ts/src:/app/src      
      - ./uploads:/app/uploads  
    depends_on:
      - postgres
    networks:
      - blockcall-network

  postgres:
    image: postgres:14
    container_name: postgres_14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exampledb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - blockcall-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: blockcall_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - blockcall-network

networks:
  blockcall-network:
    external: true 